name: Live smoke test

# Loads the deployed site in a real browser and fails unless the products page
# actually shows products. CI proves the code builds and passes its tests; this
# proves the thing that is deployed works.
#
# It runs after every push to main, and every six hours on a schedule so that
# breakage with no push behind it (a Render or API outage, a changed setting)
# is caught too.
#
# A failed run emails the repository owner (GitHub's default for workflows on
# the default branch), which is the alert. Note that GitHub pauses scheduled
# workflows after 60 days without repository activity.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# A newer push supersedes an older run still waiting on its deploy. Grouped by
# trigger so a scheduled run never cancels a push run mid-wait, or vice versa.
concurrency:
  group: live-smoke-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SITE_URL: https://consciobite-app.onrender.com
  API_URL: https://consciobite-api.onrender.com

jobs:
  smoke:
    name: Products page renders on the live site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          # The parent commit is needed to work out which services this push
          # changed, and so which Render deploys to wait for.
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: smoke/package-lock.json

      - name: Install smoke test dependencies
        working-directory: ./smoke
        run: npm ci

      - name: Install browser
        working-directory: ./smoke
        run: npx playwright install --with-deps chromium

      # Render takes a few minutes to build and publish. Testing straight away
      # would pass against the PREVIOUS deploy, so wait until each service this
      # push changed reports this commit (frontend: build/version.json written
      # by frontend/scripts/write-version.js; backend: the `commit` field of
      # /api/health/live). Each service has a rootDir in render.yaml, and Render
      # skips the deploy when nothing under it changed, so waiting on an
      # unchanged service would only time out. If a changed service never
      # reports the commit, say so and test what is live anyway: an unverified
      # deploy is worth a warning, a broken site is worth a failure.
      # Only a push has a new deploy to wait for; scheduled and manual runs
      # test whatever is live right now.
      - name: Work out which services this push deploys
        id: changed
        if: github.event_name == 'push'
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files" | grep -q '^frontend/' && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"
          echo "$files" | grep -q '^backend/' && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"

      - name: Wait for this commit to be live
        if: github.event_name == 'push'
        env:
          WAIT_FRONTEND: ${{ steps.changed.outputs.frontend }}
          WAIT_BACKEND: ${{ steps.changed.outputs.backend }}
        run: |
          site_ok=true; api_ok=true
          [ "$WAIT_FRONTEND" = "true" ] && site_ok=false
          [ "$WAIT_BACKEND" = "true" ] && api_ok=false
          echo "Waiting for: frontend=$WAIT_FRONTEND backend=$WAIT_BACKEND"
          for i in $(seq 1 60); do
            if [ "$site_ok" = false ]; then
              site=$(curl -fsS --max-time 20 "$SITE_URL/version.json?t=$(date +%s)" | jq -r '.commit' 2>/dev/null || true)
              [ "$site" = "$GITHUB_SHA" ] && site_ok=true && echo "Frontend is serving $GITHUB_SHA."
            fi
            if [ "$api_ok" = false ]; then
              api=$(curl -fsS --max-time 30 "$API_URL/api/health/live" | jq -r '.commit' 2>/dev/null || true)
              [ "$api" = "$GITHUB_SHA" ] && api_ok=true && echo "API is serving $GITHUB_SHA."
            fi
            if [ "$site_ok" = true ] && [ "$api_ok" = true ]; then
              exit 0
            fi
            echo "[$i/60] frontend: ${site:-n/a}  api: ${api:-n/a}; waiting for $GITHUB_SHA"
            sleep 15
          done
          [ "$site_ok" = true ] || echo "::warning::The frontend never reported commit $GITHUB_SHA (last seen: ${site:-unavailable}). Testing whatever is deployed."
          [ "$api_ok" = true ] || echo "::warning::The API never reported commit $GITHUB_SHA (last seen: ${api:-unavailable}). Testing whatever is deployed."

      # The API sleeps on the free tier and a cold start can outlast the browser
      # test's own wait, which made a run fail while the site was fine. Wake it
      # first, so the browser test answers "does the site work" and not "how
      # slow was the cold start". An API that stays down for the whole of this
      # loop is a real outage, and the job fails here saying so.
      - name: Wake the API
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$API_URL/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "API is healthy."
              exit 0
            fi
            echo "[$i/20] API health returned: ${code:-no response}"
            sleep 10
          done
          echo "::error::The API did not become healthy after 20 attempts."
          exit 1

      - name: Smoke test the live site
        working-directory: ./smoke
        env:
          SMOKE_BASE_URL: ${{ env.SITE_URL }}
        run: npm run smoke

      # The free plan wipes the API's disk on every restart, so without Turso
      # every account, review and audit entry is lost (backend/docs/turso.md).
      # /api/health reports which storage the running instance opened. This
      # used to be invisible: a misnamed env var booted cleanly on the local
      # file and nothing failed.
      - name: Check the API keeps its data across restarts
        run: |
          storage=$(curl -fsS --max-time 30 "$API_URL/api/health" | jq -r '.storage // "unknown"' || true)
          echo "API storage: ${storage:-no response}"
          if [ "$storage" != "turso" ]; then
            echo "::error::The live API reports storage '${storage:-no response}', not 'turso'. Accounts, reviews and the audit trail are wiped on every restart. Set TURSO_DATABASE_URL and TURSO_AUTH_TOKEN (exact names) on consciobite-api in Render; see backend/docs/turso.md."
            exit 1
          fi

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-failure
          path: smoke/smoke-failure.png
          if-no-files-found: ignore
