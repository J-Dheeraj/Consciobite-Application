name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check formatting
        working-directory: ./backend
        run: npm run format:check

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint

      - name: Run backend tests with coverage
        working-directory: ./backend
        run: npm test -- --coverage

      - name: Audit backend dependencies
        working-directory: ./backend
        run: npm audit --production --audit-level=high

  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Check formatting
        working-directory: ./frontend
        run: npm run format:check

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

      # The deployed frontend is a static export (output: 'export') — the
      # Next.js server never runs in production, so high-severity server CVEs
      # in Next 14 (whose only fix is the breaking Next 16 upgrade) don't
      # affect the shipped artifact. Gate on critical findings instead of
      # bypassing the audit entirely.
      - name: Audit frontend dependencies
        working-directory: ./frontend
        run: npm audit --production --audit-level=critical

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env:
          JWT_SECRET: ci-build-test-secret
