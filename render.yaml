# Render Blueprint - deploy both services with one click
# https://render.com/docs/blueprint-spec

services:
  # Backend API
  - type: web
    name: consciobite-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://consciobite-app.onrender.com
      - key: JWT_SECRET
        generateValue: true
    plan: free
    # Liveness, not readiness. /api/health probes the DB with BEGIN IMMEDIATE
    # and returns 503 if that write lock fails, so a momentary lock or disk
    # hiccup would make Render judge the instance unhealthy and restart it —
    # a bad failure mode for the thing that decides whether to kill the process.
    # /api/health/live has no dependencies and answers only "is the process up".
    # Readiness is still available at /api/health for monitoring and humans.
    healthCheckPath: /api/health/live

  # Frontend (Next.js static export → build/)
  - type: web
    name: consciobite-app
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: consciobite-api
          type: web
          property: host
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # Next static export with trailingSlash:true emits build/<route>/index.html,
      # so "/products/" is served as an existing resource and needs no rule; only
      # the slashless "/products" does. Render's documented path matching is:
      # resource exists -> serve it; else first matching rule from the top; else
      # 404 Not Found. A "/*" catch-all therefore matches EVERY unknown path and
      # rewrites it to a file that does not exist, which Render answers with an
      # empty 200 -- a soft 404 that also hid missing /_next assets. Render has no
      # not-found-page setting, so the only way to get a real 404 is for no rule to
      # match. Hence one explicit rule per prerendered route instead of "/*".
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /carbon
        destination: /carbon/index.html
      - type: rewrite
        source: /compare
        destination: /compare/index.html
      - type: rewrite
        source: /dashboard
        destination: /dashboard/index.html
      - type: rewrite
        source: /favorites
        destination: /favorites/index.html
      - type: rewrite
        source: /login
        destination: /login/index.html
      - type: rewrite
        source: /methodology
        destination: /methodology/index.html
      - type: rewrite
        source: /products
        destination: /products/index.html
      - type: rewrite
        source: /profile
        destination: /profile/index.html
      - type: rewrite
        source: /recipes
        destination: /recipes/index.html
      - type: rewrite
        source: /register
        destination: /register/index.html
      - type: rewrite
        source: /scan
        destination: /scan/index.html
      - type: rewrite
        source: /tips
        destination: /tips/index.html
      - type: rewrite
        source: /transparency
        destination: /transparency/index.html
      - type: rewrite
        source: /admin/conflict-log
        destination: /admin/conflict-log/index.html
      - type: rewrite
        source: /admin/manufacturers
        destination: /admin/manufacturers/index.html
      # 550 prerendered ids each; * carries the captured id into the destination.
      # A nonexistent id still yields an empty 200 here: no rule can test whether
      # the target file exists. Coverage is enforced by frontend/scripts/check-render-routes.js.
      - type: rewrite
        source: /product/*
        destination: /product/*/index.html
      - type: rewrite
        source: /passport/*
        destination: /passport/*/index.html
