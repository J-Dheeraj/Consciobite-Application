# Render Blueprint - deploy both services with one click
# https://render.com/docs/blueprint-spec

services:
  # Backend API
  - type: web
    name: consciobite-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://consciobite-app.onrender.com
      - key: JWT_SECRET
        generateValue: true
    plan: free
    healthCheckPath: /api/health

  # Frontend (Next.js)
  - type: web
    name: consciobite-app
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: consciobite-api
          type: web
          property: host
    plan: free
