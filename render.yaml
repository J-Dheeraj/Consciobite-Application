# Render Blueprint - deploy both services with one click
# https://render.com/docs/blueprint-spec

services:
  # Backend API
  - type: web
    name: consciobite-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://consciobite-app.onrender.com
      - key: JWT_SECRET
        generateValue: true
    plan: free
    # Liveness, not readiness. /api/health probes the DB with BEGIN IMMEDIATE
    # and returns 503 if that write lock fails, so a momentary lock or disk
    # hiccup would make Render judge the instance unhealthy and restart it —
    # a bad failure mode for the thing that decides whether to kill the process.
    # /api/health/live has no dependencies and answers only "is the process up".
    # Readiness is still available at /api/health for monitoring and humans.
    healthCheckPath: /api/health/live

  # Frontend (Next.js static export → build/)
  - type: web
    name: consciobite-app
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: consciobite-api
          type: web
          property: host
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # Next static export with trailingSlash:true emits build/<route>/index.html.
      # Render serves an existing resource before applying routes, so "/products/"
      # resolves on its own; "/products" has no matching file and needs this
      # rewrite. Render's destination wildcard is "*" (it re-inserts the text the
      # source "*" captured) — NOT ":splat", which is not a Render placeholder and
      # rewrote every slashless URL to a literal path that does not exist, which is
      # why those URLs returned an empty 200.
      - type: rewrite
        source: /*
        destination: /*/index.html
