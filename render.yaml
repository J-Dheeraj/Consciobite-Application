# Render Blueprint - deploy both services with one click
# https://render.com/docs/blueprint-spec

services:
  # Backend API
  - type: web
    name: consciobite-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://consciobite-app.onrender.com
      - key: JWT_SECRET
        generateValue: true
    plan: free
    healthCheckPath: /api/health

  # Frontend (Next.js static export → build/)
  - type: web
    name: consciobite-app
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: consciobite-api
          type: web
          property: host
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # Next static export with trailingSlash:true emits build/<route>/index.html.
      # Render serves existing files first and only then applies these routes, so
      # "/products/" resolves on its own but "/products" does not — it has no
      # matching file. Rewrite the slashless form to its directory index rather
      # than letting it fall through to the 404 page.
      - type: rewrite
        source: /*
        destination: /:splat/index.html
